[project]
name = "pytest-evidence-mcp"
version = "0.1.0"
description = "MCP server that gives access to structured evidence regarding pytest test failures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wilcson Araújo" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    # pytest is intentionally NOT here - it must already be installed in
    # the target project being investigated, not in this package's own
    # environment. See README (Prerequisites) and US-12.
    
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pyyaml>=6.0.0",
    "typing_extensions>=4.0.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
pytest-evidence-mcp = "pytest_evidence_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/wilcsonaraujo/pytest-evidence-mcp"
Repository = "https://github.com/wilcsonaraujo/pytest-evidence-mcp"
Issues = "https://github.com/wilcsonaraujo/pytest-evidence-mcp/issues"

[project.optional-dependencies]
dev = [
    "mcp[cli]>=2.0.0",
    "pytest>=8.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "types-PyYAML>=6.0.0",
    "types-defusedxml>=0.7.0",
    "typing_extensions>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_evidence_mcp"]

[tool.pytest.ini_options]
# tests/fixtures/sample_project is a real pytest project used as fixture
# data (test_runner.py runs it as a subprocess) - it must not be collected
# as part of this project's own suite.
norecursedirs = ["fixtures"]
